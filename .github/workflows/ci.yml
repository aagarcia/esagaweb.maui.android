name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # Android-only library: ubuntu-latest is cheaper and supports the maui-android workload.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install maui-android workload
        run: dotnet workload install maui-android

      - name: Restore
        run: dotnet restore Esagaweb.Maui.Android.slnx

      - name: Build library (Release, both TFMs)
        run: dotnet build Esagaweb.Maui.Android/Esagaweb.Maui.Android.csproj -c Release --no-restore

      - name: Test
        run: dotnet test --project Esagaweb.Maui.Android.Tests -c Release

      - name: Build Sample (Android Release)
        run: dotnet build Esagaweb.Maui.Android.Sample/Esagaweb.Maui.Android.Sample.csproj -f net10.0-android -c Release --no-restore

      - name: Pack library
        run: dotnet pack Esagaweb.Maui.Android/Esagaweb.Maui.Android.csproj -c Release --no-build -o artifacts/

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
